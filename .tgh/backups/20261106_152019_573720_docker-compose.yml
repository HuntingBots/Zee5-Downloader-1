version: '3.8'

services:
  bot:
    build: .
    container_name: tgh_downloader
    env_file: .env
    volumes:
      - ./downloads:/app/downloads
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:latest
    container_name: tgh_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
